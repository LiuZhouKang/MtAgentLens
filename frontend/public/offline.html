<!doctype html>
<html lang="zh-CN">
  <head>

        margin: 0;
        min-height: 100%;
        background: #000108;

        font-family: Inter, system-ui, sans-serif;
      }
      body {
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(520px, 100%);
        padding: 28px;
        border-radius: 24px;
        background: linear-gradient(180deg, rgba(8, 16, 28, 0.92), rgba(8, 16, 28, 0.78));
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.32);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 32px;
        line-height: 1;
      }
      p {
        margin: 0;
        line-height: 1.7;
        color: rgba(232, 242, 250, 0.72);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>当前处于离线状态</h1>
      <p>MtAgentLens 已缓存核心静态资源。请在网络恢复后刷新页面，以继续查看最新责任链路、风险事件与调查证据。</p>
    </div>
  </body>
</html>
