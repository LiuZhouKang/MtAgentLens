# Two-stage pipeline for report-normalizer.
stages:
  - unit
  - deploy

unit:
  image: python:3.12-slim
  env_file: config/.env.example
  script:
    - make test

deploy:
  needs: [unit]
  when: on_success
  ssh_config: deploy/ssh_config
  known_hosts: deploy/known_hosts
  script:
    - ./deploy/publish.sh
