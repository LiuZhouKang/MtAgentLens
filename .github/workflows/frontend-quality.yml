name: Frontend Quality

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-quality.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-quality.yml'

jobs:
  quality:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run core quality gates
        run: npm run ci:quality

      - name: Run compatibility audit
        run: npm run audit:compat

      - name: Run Lighthouse audit
        run: npm run audit:lighthouse

      - name: Upload quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-quality-artifacts
          path: |
            frontend/.trae/reports/**
            frontend/.lighthouseci/**
            frontend/playwright-report/**
            frontend/test-results/**
