name: Rust & eBPF

on:
  pull_request:
    paths:
      - 'collector/**'
      - 'bpftools/**'
      - 'scripts/**'
      - 'Makefile'
      - 'rust-toolchain.toml'
      - '.github/workflows/rust.yml'
  push:
    branches:
      - main
    paths:
      - 'collector/**'
      - 'bpftools/**'
      - 'scripts/**'
      - 'Makefile'
      - 'rust-toolchain.toml'
      - '.github/workflows/rust.yml'

jobs:
  rust:
    name: Rust & eBPF quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang llvm libelf-dev zlib1g-dev make gcc pkg-config

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: collector

      # rust-embed 在编译时读取 frontend/out/。真实前端构建由
      # frontend-quality.yml 把关，这里放最小占位让 collector 可编译。
      - name: Prepare frontend/out stub
        run: |
          mkdir -p frontend/out
          printf '<!doctype html><html><head><title>stub</title></head><body></body></html>' \
            > frontend/out/index.html

      - name: Build eBPF programs
        run: make build-bpf

      - name: Format check
        working-directory: collector
        run: cargo fmt -- --check

      - name: Clippy
        working-directory: collector
        run: cargo clippy -- -D warnings

      - name: Tests
        working-directory: collector
        run: cargo test --lib
