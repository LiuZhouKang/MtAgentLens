# Example custom scenario vocabulary.
#
# This file is NOT compiled into the binary and is NOT a default. The binary's
# embedded vocabulary is empty; a deployment opts in with
#
#   MTAGENTLENS_SCENARIO_PATTERNS=/path/to/this/file
#
# or by calling ScenarioVocabulary::load_from_path. A malformed configured file
# is a startup error, never a silent fallback.

authorized_roles = []

