<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 550" style="max-width:950px;font-family:'Microsoft YaHei','SimHei',Arial,sans-serif">
  <rect width="950" height="550" fill="#fcfcfc"/>

  <!-- title removed -->

  <!-- ===== Row 1: 3 metric bar charts ===== -->
  <!-- Y-axis (x=70, y=65..245, 180px range) -->
  <line x1="70" y1="65" x2="70" y2="245" stroke="#333" stroke-width="1.5"/>
  <line x1="65" y1="245" x2="70" y2="245" stroke="#888" stroke-width="1"/>
  <text x="55" y="249" text-anchor="end" font-size="9" fill="#888">0.00</text>
  <line x1="65" y1="200" x2="70" y2="200" stroke="#888" stroke-width="1"/>
  <text x="55" y="204" text-anchor="end" font-size="9" fill="#888">0.25</text>
  <line x1="65" y1="155" x2="70" y2="155" stroke="#888" stroke-width="1"/>
  <text x="55" y="159" text-anchor="end" font-size="9" fill="#888">0.50</text>
  <line x1="65" y1="110" x2="70" y2="110" stroke="#888" stroke-width="1"/>
  <text x="55" y="114" text-anchor="end" font-size="9" fill="#888">0.75</text>
  <line x1="65" y1="65" x2="70" y2="65" stroke="#888" stroke-width="1"/>
  <text x="55" y="69" text-anchor="end" font-size="9" fill="#888">1.00</text>

  <!-- Row 1 headers -->
  <text x="215" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#333">ITT-TPR</text>
  <text x="475" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#333">F1</text>
  <text x="735" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#333">MCC</text>

  <!-- ITT-TPR: center=215, w=36 gap=6, left edges 128,174,220,266 -->
  <rect x="128" y="84" width="36" height="161" fill="#00629B" rx="2"/>
  <text x="146" y="76" text-anchor="middle" font-size="9" fill="#333">0.896</text>
  <rect x="174" y="181" width="36" height="64" fill="#C8501E" rx="2"/>
  <text x="192" y="173" text-anchor="middle" font-size="9" fill="#333">0.358</text>
  <rect x="220" y="121" width="36" height="124" fill="#646464" rx="2"/>
  <text x="238" y="113" text-anchor="middle" font-size="9" fill="#333">0.687</text>
  <rect x="266" y="218" width="36" height="27" fill="#A0A0A0" rx="2"/>
  <text x="284" y="210" text-anchor="middle" font-size="9" fill="#333">0.149</text>

  <!-- F1: center=475, left edges 388,434,480,526 -->
  <rect x="388" y="75" width="36" height="170" fill="#00629B" rx="2"/>
  <text x="406" y="67" text-anchor="middle" font-size="9" fill="#333">0.945</text>
  <rect x="434" y="156" width="36" height="89" fill="#C8501E" rx="2"/>
  <text x="452" y="148" text-anchor="middle" font-size="9" fill="#333">0.495</text>
  <rect x="480" y="116" width="36" height="129" fill="#646464" rx="2"/>
  <text x="498" y="108" text-anchor="middle" font-size="9" fill="#333">0.719</text>
  <rect x="526" y="200" width="36" height="45" fill="#A0A0A0" rx="2"/>
  <text x="544" y="192" text-anchor="middle" font-size="9" fill="#333">0.253</text>

  <!-- MCC: center=735, left edges 648,694,740,786 -->
  <rect x="648" y="99" width="36" height="146" fill="#00629B" rx="2"/>
  <text x="666" y="91" text-anchor="middle" font-size="9" fill="#333">0.809</text>
  <rect x="694" y="236" width="36" height="9" fill="#C8501E" rx="2"/>
  <text x="712" y="228" text-anchor="middle" font-size="9" fill="#333">0.053</text>
  <rect x="740" y="245" width="36" height="20" fill="#c46262" rx="2"/>
  <text x="758" y="273" text-anchor="middle" font-size="9" fill="#c46262">−0.110</text>
  <rect x="786" y="245" width="36" height="23" fill="#c46262" rx="2"/>
  <text x="804" y="276" text-anchor="middle" font-size="9" fill="#c46262">−0.128</text>

  <!-- ===== Section title ===== -->
  <text x="475" y="295" text-anchor="middle" font-size="14" font-weight="700" fill="#333">按攻击类型 TPR 与检测差距性质</text>

  <!-- ===== Row 2: Comparison table ===== -->
  <!-- Table header -->
  <text x="100" y="325" text-anchor="middle" font-size="11" font-weight="700" fill="#333">攻击类型</text>
  <text x="255" y="325" text-anchor="middle" font-size="11" font-weight="700" fill="#333">MtAgentLens</text>
  <text x="400" y="325" text-anchor="middle" font-size="11" font-weight="700" fill="#333">Agent Sentinel</text>
  <text x="545" y="325" text-anchor="middle" font-size="11" font-weight="700" fill="#333">LLM Guard</text>
  <text x="690" y="325" text-anchor="middle" font-size="11" font-weight="700" fill="#333">Meta Prompt Guard</text>
  <text x="835" y="325" text-anchor="middle" font-size="11" font-weight="700" fill="#333">差距性质</text>

  <!-- Row A background -->
  <rect x="20" y="338" width="910" height="28" fill="#edf3f8" rx="0"/>

  <!-- Row A -->
  <text x="100" y="357" text-anchor="middle" font-size="10" fill="#555">A — 直接注入 (n=10)</text>
  <text x="255" y="357" text-anchor="middle" font-size="10" fill="#00629B" font-weight="bold">0.900</text>
  <text x="400" y="357" text-anchor="middle" font-size="10" fill="#555">0.900</text>
  <text x="545" y="357" text-anchor="middle" font-size="10" fill="#555">0.500</text>
  <text x="690" y="357" text-anchor="middle" font-size="10" fill="#555">0.000</text>
  <text x="835" y="357" text-anchor="middle" font-size="10" fill="#333">结构性</text>

  <!-- Row B -->
  <text x="100" y="387" text-anchor="middle" font-size="10" fill="#555">B — 间接注入 (n=34)</text>
  <text x="255" y="387" text-anchor="middle" font-size="10" fill="#00629B" font-weight="bold">0.824</text>
  <text x="400" y="387" text-anchor="middle" font-size="10" fill="#555">0.353</text>
  <text x="545" y="387" text-anchor="middle" font-size="10" fill="#555">0.853¹</text>
  <text x="690" y="387" text-anchor="middle" font-size="10" fill="#555">0.235</text>
  <text x="835" y="387" text-anchor="middle" font-size="10" fill="#333">结构性</text>

  <!-- Row C background -->
  <rect x="20" y="398" width="910" height="28" fill="#edf3f8" rx="0"/>

  <!-- Row C -->
  <text x="100" y="417" text-anchor="middle" font-size="10" fill="#555">C — 多Agent (n=23)</text>
  <text x="255" y="417" text-anchor="middle" font-size="10" fill="#00629B" font-weight="bold">1.000</text>
  <text x="400" y="417" text-anchor="middle" font-size="10" fill="#555">0.130</text>
  <text x="545" y="417" text-anchor="middle" font-size="10" fill="#555">0.522</text>
  <text x="690" y="417" text-anchor="middle" font-size="10" fill="#555">0.087</text>
  <text x="835" y="417" text-anchor="middle" font-size="10" fill="#C8501E" font-weight="bold">原理性 — 无恶意文本</text>

  <!-- Notes -->
  <text x="30" y="452" font-size="9" fill="#888">¹ LLM Guard Type B TPR = 0.853 以 FPR = 0.789 为代价, 实际不可用。</text>
  <text x="30" y="468" font-size="9" fill="#C8501E">Type C 的差距是原理性的: prompt基线分析孤立的prompt文本, 而多Agent攻击中无任何单个prompt是恶意的。</text>

  <!-- ===== Legend: bottom center, horizontal ===== -->
  <rect x="220" y="498" width="14" height="14" fill="#00629B" rx="2"/>
  <text x="240" y="510" font-size="11" fill="#333">MtAgentLens</text>
  <rect x="360" y="498" width="14" height="14" fill="#C8501E" rx="2"/>
  <text x="380" y="510" font-size="11" fill="#333">Agent Sentinel</text>
  <rect x="510" y="498" width="14" height="14" fill="#646464" rx="2"/>
  <text x="530" y="510" font-size="11" fill="#333">LLM Guard</text>
  <rect x="640" y="498" width="14" height="14" fill="#A0A0A0" rx="2"/>
  <text x="660" y="510" font-size="11" fill="#333">Meta Prompt Guard</text>
</svg>
