# Deployment manifest for the payments api.
[service]
name = "payments-api"
owner = "payments-integrations"
replicas = 3
runtime = "container"

[secrets]
# Env variable -> inventory id. Values are resolved from the vault at deploy.
PAYMENTS_DB_PASSWORD = "CRED-001"
STRIPE_API_KEY = "CRED-002"
SENTRY_DSN_TOKEN = "CRED-005"
REDIS_AUTH_TOKEN = "CRED-006"

[deploy]
account = "ops-deploy"
identity = "CRED-003"
entrypoint = "bastion.payments.internal"
tls_certificate = "CRED-004"
