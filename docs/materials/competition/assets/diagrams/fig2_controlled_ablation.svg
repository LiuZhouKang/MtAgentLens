<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 615" style="max-width:950px;font-family:'Microsoft YaHei','SimHei',Arial,sans-serif">
  <rect width="950" height="615" fill="#fcfcfc"/>

  <!-- title removed -->

  <!-- ===== Top-left: AUROC bar chart ===== -->
  <!-- Y-axis (x=70, y=65..260, 195px range) -->
  <text x="60" y="48" text-anchor="end" font-size="12" font-weight="700" fill="#333">AUROC</text>
  <line x1="70" y1="65" x2="70" y2="260" stroke="#333" stroke-width="1.5"/>
  <line x1="65" y1="260" x2="70" y2="260" stroke="#888" stroke-width="1"/>
  <text x="55" y="264" text-anchor="end" font-size="9" fill="#888">0.00</text>
  <line x1="65" y1="211" x2="70" y2="211" stroke="#888" stroke-width="1"/>
  <text x="55" y="215" text-anchor="end" font-size="9" fill="#888">0.25</text>
  <line x1="65" y1="162" x2="70" y2="162" stroke="#888" stroke-width="1"/>
  <text x="55" y="166" text-anchor="end" font-size="9" fill="#888">0.50</text>
  <line x1="65" y1="114" x2="70" y2="114" stroke="#888" stroke-width="1"/>
  <text x="55" y="118" text-anchor="end" font-size="9" fill="#888">0.75</text>
  <line x1="65" y1="65" x2="70" y2="65" stroke="#888" stroke-width="1"/>
  <text x="55" y="69" text-anchor="end" font-size="9" fill="#888">1.00</text>

  <!-- L0 bar (gray baseline) -->
  <rect x="145" y="116" width="95" height="144" fill="#888" rx="3"/>
  <text x="192" y="108" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">0.739</text>
  <text x="192" y="285" text-anchor="middle" font-size="10" fill="#555">L0 启发式</text>

  <!-- L1 bar -->
  <rect x="280" y="74" width="95" height="186" fill="#00629B" rx="3"/>
  <text x="327" y="66" text-anchor="middle" font-size="11" font-weight="bold" fill="#00629B">0.953</text>
  <text x="327" y="285" text-anchor="middle" font-size="10" fill="#333">L1 +eBPF+PBC</text>

  <!-- L0→L1 Δ -->
  <text x="260" y="86" text-anchor="middle" font-size="10" fill="#C8501E" font-weight="bold">Δ=+0.214</text>
  <text x="260" y="100" text-anchor="middle" font-size="8" fill="#C8501E">p&lt;0.001</text>

  <!-- L2 bar -->
  <rect x="415" y="72" width="95" height="188" fill="#00629B" rx="3"/>
  <text x="462" y="64" text-anchor="middle" font-size="11" font-weight="bold" fill="#00629B">0.962</text>
  <text x="462" y="285" text-anchor="middle" font-size="10" fill="#333">L2 +责任图</text>

  <!-- L1→L2 Δ -->
  <text x="395" y="86" text-anchor="middle" font-size="10" fill="#C8501E" font-weight="bold">Δ=+0.009</text>

  <!-- L3 bar -->
  <rect x="550" y="72" width="95" height="188" fill="#00629B" rx="3"/>
  <text x="597" y="64" text-anchor="middle" font-size="11" font-weight="bold" fill="#00629B">0.962</text>
  <text x="597" y="285" text-anchor="middle" font-size="10" fill="#333">L3 +Observer</text>

  <!-- L2→L3 Δ -->
  <text x="530" y="86" text-anchor="middle" font-size="10" fill="#C8501E" font-weight="bold">Δ=+0.000</text>

  <!-- ===== Top-right: Attack type AUROC table ===== -->
  <text x="780" y="48" text-anchor="middle" font-size="12" font-weight="700" fill="#333">各层按攻击类型 AUROC</text>

  <!-- Table header -->
  <text x="680" y="78" text-anchor="middle" font-size="10" font-weight="700" fill="#333">层</text>
  <text x="760" y="78" text-anchor="middle" font-size="10" font-weight="700" fill="#333">Type A</text>
  <text x="840" y="78" text-anchor="middle" font-size="10" font-weight="700" fill="#333">Type B</text>
  <text x="920" y="78" text-anchor="middle" font-size="10" font-weight="700" fill="#333">Type C</text>

  <!-- Row L0 bg -->
  <rect x="655" y="88" width="285" height="22" fill="#edf3f8" rx="0"/>
  <text x="680" y="103" text-anchor="middle" font-size="10" fill="#555">L0</text>
  <text x="760" y="103" text-anchor="middle" font-size="10" fill="#555">0.750</text>
  <text x="840" y="103" text-anchor="middle" font-size="10" fill="#555">0.721</text>
  <text x="920" y="103" text-anchor="middle" font-size="10" fill="#555">0.761</text>

  <!-- Row L1 -->
  <text x="680" y="125" text-anchor="middle" font-size="10" fill="#555">L1</text>
  <text x="760" y="125" text-anchor="middle" font-size="10" fill="#555">0.947</text>
  <text x="840" y="125" text-anchor="middle" font-size="10" fill="#555">0.923</text>
  <text x="920" y="125" text-anchor="middle" font-size="10" fill="#00629B" font-weight="bold">1.000</text>

  <!-- Row L2 bg -->
  <rect x="655" y="134" width="285" height="22" fill="#edf3f8" rx="0"/>
  <text x="680" y="149" text-anchor="middle" font-size="10" fill="#555">L2</text>
  <text x="760" y="149" text-anchor="middle" font-size="10" fill="#555">0.984</text>
  <text x="840" y="149" text-anchor="middle" font-size="10" fill="#555">0.930</text>
  <text x="920" y="149" text-anchor="middle" font-size="10" fill="#00629B" font-weight="bold">1.000</text>

  <!-- Row L3 -->
  <text x="680" y="171" text-anchor="middle" font-size="10" fill="#555">L3</text>
  <text x="760" y="171" text-anchor="middle" font-size="10" fill="#555">0.984</text>
  <text x="840" y="171" text-anchor="middle" font-size="10" fill="#555">0.930</text>
  <text x="920" y="171" text-anchor="middle" font-size="10" fill="#00629B" font-weight="bold">1.000</text>

  <!-- ===== Section title ===== -->
  <text x="475" y="320" text-anchor="middle" font-size="15" font-weight="700" fill="#333">分数分布分离度 (攻击 vs 良性)</text>

  <!-- ===== Bottom-left: Cohen's d bar chart ===== -->
  <!-- Y-axis (x=70, y=360..520, 160px range, 40px/unit) -->
  <text x="60" y="345" text-anchor="end" font-size="12" font-weight="700" fill="#333">Cohen's d</text>
  <line x1="70" y1="360" x2="70" y2="520" stroke="#333" stroke-width="1.5"/>
  <line x1="65" y1="520" x2="70" y2="520" stroke="#888" stroke-width="1"/>
  <text x="55" y="524" text-anchor="end" font-size="9" fill="#888">0</text>
  <line x1="65" y1="480" x2="70" y2="480" stroke="#888" stroke-width="1"/>
  <text x="55" y="484" text-anchor="end" font-size="9" fill="#888">1</text>
  <line x1="65" y1="440" x2="70" y2="440" stroke="#888" stroke-width="1"/>
  <text x="55" y="444" text-anchor="end" font-size="9" fill="#888">2</text>
  <line x1="65" y1="400" x2="70" y2="400" stroke="#888" stroke-width="1"/>
  <text x="55" y="404" text-anchor="end" font-size="9" fill="#888">3</text>
  <line x1="65" y1="360" x2="70" y2="360" stroke="#888" stroke-width="1"/>
  <text x="55" y="364" text-anchor="end" font-size="9" fill="#888">4</text>

  <!-- Cohen's d bars -->
  <rect x="145" y="470" width="95" height="50" fill="#C8501E" rx="3"/>
  <text x="192" y="462" text-anchor="middle" font-size="11" font-weight="bold" fill="#C8501E">1.255</text>
  <text x="192" y="540" text-anchor="middle" font-size="10" fill="#555">L0</text>

  <rect x="280" y="381" width="95" height="139" fill="#C8501E" rx="3"/>
  <text x="327" y="373" text-anchor="middle" font-size="11" font-weight="bold" fill="#C8501E">3.464</text>
  <text x="327" y="540" text-anchor="middle" font-size="10" fill="#555">L1</text>

  <rect x="415" y="377" width="95" height="143" fill="#C8501E" rx="3"/>
  <text x="462" y="369" text-anchor="middle" font-size="11" font-weight="bold" fill="#C8501E">3.572</text>
  <text x="462" y="540" text-anchor="middle" font-size="10" fill="#555">L2</text>

  <rect x="550" y="369" width="95" height="151" fill="#C8501E" rx="3"/>
  <text x="597" y="361" text-anchor="middle" font-size="11" font-weight="bold" fill="#C8501E">3.768</text>
  <text x="597" y="540" text-anchor="middle" font-size="10" fill="#555">L3</text>

  <!-- ===== Bottom-right: Distribution table ===== -->
  <text x="780" y="345" text-anchor="middle" font-size="12" font-weight="700" fill="#333">分数分布分离度</text>

  <text x="690" y="375" text-anchor="middle" font-size="10" font-weight="700" fill="#333">层</text>
  <text x="765" y="375" text-anchor="middle" font-size="10" font-weight="700" fill="#333">攻击P50</text>
  <text x="840" y="375" text-anchor="middle" font-size="10" font-weight="700" fill="#333">良性P50</text>
  <text x="915" y="375" text-anchor="middle" font-size="10" font-weight="700" fill="#333">Cohen's d</text>

  <!-- Row L0 bg -->
  <rect x="665" y="385" width="265" height="22" fill="#edf3f8" rx="0"/>
  <text x="690" y="400" text-anchor="middle" font-size="10" fill="#555">L0</text>
  <text x="765" y="400" text-anchor="middle" font-size="10" fill="#555">0.460</text>
  <text x="840" y="400" text-anchor="middle" font-size="10" fill="#555">0.460</text>
  <text x="915" y="400" text-anchor="middle" font-size="10" fill="#00629B" font-weight="bold">1.25</text>

  <!-- Row L1 -->
  <text x="690" y="422" text-anchor="middle" font-size="10" fill="#555">L1</text>
  <text x="765" y="422" text-anchor="middle" font-size="10" fill="#555">0.853</text>
  <text x="840" y="422" text-anchor="middle" font-size="10" fill="#555">0.000</text>
  <text x="915" y="422" text-anchor="middle" font-size="10" fill="#00629B" font-weight="bold">3.46</text>

  <!-- Row L2 bg -->
  <rect x="665" y="432" width="265" height="22" fill="#edf3f8" rx="0"/>
  <text x="690" y="447" text-anchor="middle" font-size="10" fill="#555">L2</text>
  <text x="765" y="447" text-anchor="middle" font-size="10" fill="#555">0.956</text>
  <text x="840" y="447" text-anchor="middle" font-size="10" fill="#555">0.000</text>
  <text x="915" y="447" text-anchor="middle" font-size="10" fill="#00629B" font-weight="bold">3.57</text>

  <!-- Row L3 -->
  <text x="690" y="469" text-anchor="middle" font-size="10" fill="#555">L3</text>
  <text x="765" y="469" text-anchor="middle" font-size="10" fill="#555">0.973</text>
  <text x="840" y="469" text-anchor="middle" font-size="10" fill="#555">0.000</text>
  <text x="915" y="469" text-anchor="middle" font-size="10" fill="#00629B" font-weight="bold">3.77</text>

  <!-- ===== Legend (bottom center) ===== -->
  <rect x="260" y="555" width="14" height="14" fill="#888" rx="2"/>
  <text x="280" y="567" font-size="11" fill="#555">L0 启发式基准</text>
  <rect x="405" y="555" width="14" height="14" fill="#00629B" rx="2"/>
  <text x="425" y="567" font-size="11" fill="#555">L1–L3 MtAgentLens 系统层</text>
  <rect x="590" y="555" width="14" height="14" fill="#C8501E" rx="2"/>
  <text x="610" y="567" font-size="11" fill="#555">Cohen's d / Δ增量</text>

  <!-- ===== Footer ===== -->
  <text x="475" y="593" text-anchor="middle" font-size="10" fill="#C8501E" font-weight="bold">核心发现: L0→L1 (eBPF+PBC) 是唯一统计显著的检测增益 (ΔAUROC=+0.214, p&lt;0.001); L1→L2 改善校准; L3 为纯校准层</text>
  <text x="475" y="610" text-anchor="middle" font-size="9" fill="#888">Type C 从 L1 起即达 AUROC=1.000 — PBC门控与多Agent攻击存在结构性对齐 (协作 → 边界穿越信号)</text>
</svg>
