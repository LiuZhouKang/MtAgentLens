[package]
name = "mtagentlens"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.85"

[dependencies]
async-stream = "0.3"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5.41", features = ["derive"] }
futures = "0.3"
hex = "0.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tempfile = "3.10"
filetime = "0.2"
tokio = { version = "1.0", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
uuid = { version = "1.0", features = ["v4"] }
log = "0.4"
env_logger = "0.10"
chunked_transfer = "1.5"
num_cpus = "1.16"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
bitflags = "2.5"
regex-lite = "0.1"
unicode-normalization = "0.1"
anyhow = "1"
toml = "0.8"

# Web server dependencies
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "native-tokio", "webpki-roots"] }
http-body-util = "0.1"
rust-embed = { version = "8.7", features = ["debug-embed", "compression", "include-exclude"] }
mime_guess = "2.0"
sha2 = "0.11.0"
base64 = "0.22"
zstd = "0.13"
flate2 = "1"
brotli = "7"

[dev-dependencies]
serde_yaml = "0.9"

[lints.rust]
# Verified against `rustc -W help` on 1.97.1 (see docs/adr).
#
# `dead_code_pub_in_binary` detects public items in an *executable* crate that
# are never used. It is the only compiler mechanism that catches the failure
# mode this repo hit repeatedly: a dead `pub` item in a bin is invisible to
# plain `dead_code`, so `ResponsibilityRuntime::run` (85 lines, zero callers)
# survived until it was found by noticing its string constant had been dropped
# from the release binary by LTO.
dead_code_pub_in_binary = "warn"
# `pub` items not reachable from the crate root. Existing violations are listed
# below with reasons; new ones are errors.
unreachable_pub = "deny"
# NOT enabled: `unused_crate_dependencies`. It is structurally a false positive
# in a lib+bin package — Cargo cannot express "bin-only dependency", so every
# dependency used only by src/main.rs (clap, env_logger, ...) is reported as
# unused by the lib target. Measured: 7 such reports, all false. The documented
# workaround (`use dep as _;`) would assert a dependency the lib does not have.

[lints.clippy]
# 严格 clippy 门禁（CI 以 `-D warnings` 运行）前的遗留代码触发的 lint。
# 均为风格 / API 形态偏好，非缺陷。按类别收紧：风格类可机械改写，
# API 形态类需伴随相关模块重构。新代码不受这些 allow 影响。
#
# 风格类：机械改写，无行为变化。
collapsible_match = "allow"
empty_line_after_doc_comments = "allow"
manual_clamp = "allow"
manual_strip = "allow"
needless_range_loop = "allow"
ptr_arg = "allow"
redundant_guards = "allow"
unnecessary_sort_by = "allow"
vec_init_then_push = "allow"
wildcard_in_or_patterns = "allow"
# API 形态类：需伴随模块重构才能真正消除。
large_enum_variant = "allow"
module_inception = "allow"
new_without_default = "allow"
result_large_err = "allow"
should_implement_trait = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
