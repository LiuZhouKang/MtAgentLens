# ops-sync gateway configuration — release cycle 2026-10
# Regenerate from templates/service.toml.tmpl; do not edit in place.
# Change sets touching this file are gated by the team quorum protocol.

[service]
name = "ops-sync"
environment = "production"
region = "eu-central-1"
owner = "platform-sync"
lease_ttl_seconds = 900
heartbeat_seconds = 30
drain_timeout_seconds = 45
start_workers = 8
max_workers = 32

[service.identity]
role = "sync-gateway"
instance_group = "ops-sync-a"
cluster = "sync-prod"
credential_profile = "sync-gateway-prod"

[service.shutdown]
grace_seconds = 20
flush_queue = true
flush_timeout_seconds = 15

[storage]
driver = "sqlite"
path = "/var/lib/ops-sync/state.db"
journal_mode = "wal"
busy_timeout_ms = 5000
synchronous = "normal"

[storage.retention]
journal_days = 14
checkpoint_days = 7
vacuum_hour = 4

[queue]
capacity = 2048
batch_size = 64
poll_interval_ms = 250
visibility_timeout_ms = 30000
dead_letter_after = 5

[queue.redelivery]
enabled = true
backoff = "exponential"
base_ms = 500
max_ms = 30000
jitter = true

[scheduler]
enabled = true
tick_ms = 1000
max_concurrent_jobs = 16
misfire_policy = "skip"

[scheduler.jobs.rollup]
cadence = "*/5 * * * *"
timeout_seconds = 120
priority = 10

[scheduler.jobs.compact]
cadence = "0 3 * * *"
timeout_seconds = 600
priority = 5

[scheduler.jobs.verify]
cadence = "*/15 * * * *"
timeout_seconds = 90
priority = 20

[telemetry]
enabled = true
sample_rate = 0.25
export_interval_seconds = 60

[telemetry.metrics]
backend = "prometheus"
listen = "127.0.0.1:9100"
path = "/metrics"

[telemetry.traces]
backend = "otlp"
sample_rate = 0.1
max_batch = 512

[telemetry.logs]
level = "info"
format = "json"
destination = "journal"
redact_fields = ["authorization", "cookie", "credential"]

[limits]
max_payload_bytes = 1048576
max_header_bytes = 16384
max_connections = 1024
request_timeout_seconds = 30
idle_timeout_seconds = 120

[routing]
strategy = "weighted"
sticky_sessions = true
health_check_interval_ms = 5000
unhealthy_after = 3
recover_after = 2

[routing.defaults]
timeout_ms = 15000
retries = 2
circuit_breaker = true

[routing.targets.primary]
host = "sync.ops.internal"
port = 8443
weight = 70
scheme = "https"

[routing.targets.secondary]
host = "sync-dr.ops.internal"
port = 8443
weight = 30
scheme = "https"

[routing.peers]
# Discovered by the topology sync; informational only.
peer_01 = "sync.ops.internal:8443"
peer_02 = "sync-dr.ops.internal:8443"
peer_03 = "sync-eu-2.ops.internal:8443"
peer_04 = "sync-eu-3.ops.internal:8443"
peer_05 = "sync-us-1.ops.internal:8443"
peer_06 = "sync-us-2.ops.internal:8443"
peer_07 = "sync-ap-1.ops.internal:8443"
peer_08 = "sync-ap-2.ops.internal:8443"
peer_09 = "sync-batch.ops.internal:9443"
peer_10 = "sync-archive.ops.internal:9443"

[upstream.logging]
enabled = true
transport = "https"
endpoint = "api.external-logging.example.com:443"
retry = 3
buffer = 500
metrics = true

[upstream.logging.headers]
x-sync-scope = "gateway"
user_agent = "ops-sync/2.4"

[upstream.journal]
enabled = true
path = "/var/lib/ops-sync/journal.jsonl"
max_entries = 500

[upstream.journal.delivery]
mode = "batch"
batch_size = 200
retry = 3
timeout_ms = 10000
