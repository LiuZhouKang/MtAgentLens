<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" style="max-width:800px;font-family:'Microsoft YaHei','SimHei',Arial,sans-serif">
  <rect width="800" height="420" fill="#fcfcfc"/>

  <!-- title removed -->

  <!-- Column headers -->
  <text x="140" y="36" text-anchor="middle" font-size="14" font-weight="700" fill="#333">CPU SSL密集 (%)</text>
  <text x="340" y="36" text-anchor="middle" font-size="14" font-weight="700" fill="#333">CPU 文件I/O密集 (%)</text>
  <text x="540" y="36" text-anchor="middle" font-size="14" font-weight="700" fill="#333">SSL 吞吐量 (req/s)</text>

  <!-- Group 1: CPU SSL -->
  <rect x="105" y="190" width="50" height="135" fill="#888" rx="3"/>
  <text x="130" y="182" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">45.2</text>
  <rect x="165" y="184" width="50" height="141" fill="#00629B" rx="3"/>
  <text x="190" y="176" text-anchor="middle" font-size="11" fill="#00629B" font-weight="bold">47.1</text>

  <!-- Group 2: CPU IO -->
  <rect x="305" y="137" width="50" height="188" fill="#888" rx="3"/>
  <text x="330" y="129" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">62.8</text>
  <rect x="365" y="133" width="50" height="192" fill="#00629B" rx="3"/>
  <text x="390" y="125" text-anchor="middle" font-size="11" fill="#00629B" font-weight="bold">64.1</text>

  <!-- Group 3: SSL Throughput -->
  <rect x="505" y="136" width="50" height="189" fill="#888" rx="3"/>
  <text x="530" y="128" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">1240</text>
  <rect x="565" y="142" width="50" height="183" fill="#00629B" rx="3"/>
  <text x="590" y="134" text-anchor="middle" font-size="11" fill="#00629B" font-weight="bold">1205</text>

  <!-- Overhead labels -->
  <text x="140" y="345" text-anchor="middle" font-size="13" fill="#C8501E" font-weight="bold">+4.2%</text>
  <text x="340" y="345" text-anchor="middle" font-size="13" fill="#C8501E" font-weight="bold">+2.1%</text>
  <text x="540" y="345" text-anchor="middle" font-size="13" fill="#5a9e6f" font-weight="bold">−2.8%</text>

  <!-- Memory bar -->
  <text x="120" y="378" font-size="13" fill="#333" font-weight="bold">常驻内存增量</text>
  <rect x="265" y="365" width="160" height="26" fill="#C8501E" rx="4"/>
  <text x="345" y="383" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">+8.7 MB</text>

  <!-- Legend (top-right) -->
  <rect x="610" y="20" width="14" height="14" fill="#888" rx="2"/>
  <text x="632" y="32" font-size="11" fill="#333">基准线 (无eBPF)</text>
  <rect x="610" y="42" width="14" height="14" fill="#00629B" rx="2"/>
  <text x="632" y="54" font-size="11" fill="#333">MtAgentLens (5探针)</text>
  <rect x="610" y="64" width="14" height="14" fill="#C8501E" rx="2"/>
  <text x="632" y="76" font-size="11" fill="#333">开销增量</text>

  <!-- Footer -->
  <text x="400" y="416" text-anchor="middle" font-size="10" fill="#888">性能开销控制在 5% 以内 — 满足端侧部署轻量化要求 | 延迟 ~218 ns/SSL 操作 (&lt;&lt; TLS 1.3 握手 1–5 ms)</text>
</svg>
